    <figcaption>
      <h1>How a research job becomes a legal memo</h1>
      <p class="stamp">Based on commit <a href="https://github.com/Mharbulous/probanda-dev/commit/f7c757db401a2592d03e66698024a152bd0d6fea"><code>f7c757db</code></a> on main · Last updated 2026-11-06 00:42 -07:00</p>
    </figcaption>
    <p>Research runs only under a job titled <code>Legal research: &lt;issue&gt;</code>, holding one question, and it ends only in a saved memo, never in a reply in chat. The <code>/legal-research</code> gate runs every step from the main session, because only the main session can spawn agents. Each skill and each custom agent is one box.</p>
    <p>Solid arrows are the gate's steps, in order. Dashed arrows are loops back into the gate, or optional calls.</p>

      <span><i style="background:#e2f3e6;border-color:#2f7d46"></i>The deliverable</span>
    </div>

    <div class="note">
      <p>How the steps map to the sources: Step 1 is the gate's steps 1a and 2a. Steps 2 to 4 are the doctrine's duties 3, 4 and 5. Step 5 is the gate's step 4. Steps 6 to 9 are the gate's step 5 and the doctrine's "After the answer". Step 10 is <code>/draft</code>'s job-session Complete step. Not drawn:</p>
      <ul>
        <li>Step 0, the preflight, and the statute currency check at the end of Step 3 are tool calls, not skills or agents.</li>
        <li>A statutory-text question (one naming an instrument and asking what it provides) runs legislation mode before Westlaw.</li>
        <li>Westlaw is skipped for an issue that text already on file answers at a pinpoint, or that asks only what an amendment changed.</li>
        <li>Any <code>status: blocked (...)</code> from law-getter or citation-checker stops the whole question until the practitioner says to continue. On a held job, the Westlaw wait is a ⏳ step checked every 5 minutes.</li>
        <li>Only one Chrome run is out at a time: law-getter's deep-research and citation modes, and citation-checker, share one Chrome session. Legislation mode may run beside them.</li>
        <li>After a third review that accepts nothing, the memo is saved <code>INCOMPLETE</code>, and the job cannot be completed until its open research runs or the practitioner says to complete it without it.</li>
        <li>In board mode the session holds at most three research jobs at once, and passes each job the memos of the jobs that blocked it.</li>
        <li>The tier-2 pool lookup is the caller's only when research-agent lacks the pool tools. At this commit it holds them, so <code>/legal-commons</code> takes no part.</li>
        <li>A case brief job (<code>Brief the case: </code>) and a proposition-level note-up run under their own routes.</li>
      </ul>
      <p>Sources: <code>.claude/skills/legal-research/SKILL.md</code>, <code>.claude/skills/shared/legal-research.md</code>, <code>.claude/skills/legal-research/references/research-board.md</code>, <code>.claude/skills/shared/job-planning.md</code>, <code>.claude/skills/job-planning/SKILL.md</code>, <code>.claude/skills/draft/references/job-session.md</code>, <code>.claude/skills/work/SKILL.md</code>, <code>.claude/skills/apply-to-facts/SKILL.md</code>, <code>.claude/skills/verify-law/SKILL.md</code>, the five agents under <code>source/researcher/agents/</code>, <code>source/assignment.json</code>.</p>
