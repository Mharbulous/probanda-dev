    <figcaption>
      <h1>The life of a probanda-dev issue</h1>
      <p class="stamp">Based on commit <a href="https://github.com/Mharbulous/probanda-dev/commit/d06e50fa26ec0e534acabab63cc1943a61fe0e3c"><code>d06e50fa</code></a> on main · Last updated 2026-11-05 01:34 -07:00</p>
    </figcaption>
    <p>Every issue passes through triage, which labels its state and where the work can run. A label then decides who works on it next.</p>
    <p>The queue stops only when no issues are left, when only issues needing a person are left, when only <code>local</code> issues are left while the PC is unavailable, or for a mix of the last two.</p>

      <span><i style="background:#efe8fb;border-color:#6b46b0"></i>Runs on the developer's PC, unattended</span>
      <span><i style="background:#fdf0d5;border-color:#b7791f"></i>Needs the developer</span>

    <div class="note">
      <p>Pick to push is one procedure shared by both implementers, so it is drawn once, in blue, wherever a given run happens. What starts the local implementer is drawn in <a href="Local implementer start.html">Local implementer start</a>. Not drawn:</p>
      <ul>
        <li>Each lane's gate is the full list in <code>implement-queue.md</code>.</li>
        <li>In a cloud run, every outcome returns to Pick, not only the dashed one. A local run exits after one issue, whatever the outcome.</li>
        <li>A sender can withdraw a suggestion before the push, which discards the unpushed build. Intake then closes the issue.</li>
        <li>Suggestions merged by fingerprint take the decision of the issue they merge into.</li>
        <li>Locks: triage #61, intake #190. Claims: 5 hours per issue, 1 hour for <code>/hitl-triage</code>.</li>
        <li>Local work that writes under <code>.claude/</code> goes to <code>ready-for-human</code>, for an attended session.</li>
      </ul>
      <p>Sources: <code>docs/agents/issue-tracker.md</code>, <code>.claude/commands/triage-issue.md</code>, <code>.claude/commands/implement-queue.md</code>, <code>.claude/commands/intake-suggestions.md</code>, <code>.claude/skills/hitl-triage/</code>, <code>scripts/choose_issue.py</code>, <code>.github/workflows/data-mcp-tests.yml</code>, <code>.github/workflows/skills-python-tests.yml</code>.</p>
