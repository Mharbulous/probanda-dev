<main>
  <figure class="diagram" id="local-implementer-start"
          data-based-on-commit="d06e50fa26ec0e534acabab63cc1943a61fe0e3c"
          data-updated="2026-11-05T01:34:00-07:00">
    <figcaption>
      <h1>What starts the local implementer</h1>
      <p class="stamp">Based on commit <a href="https://github.com/Mharbulous/probanda-dev/commit/d06e50fa26ec0e534acabab63cc1943a61fe0e3c"><code>d06e50fa</code></a> on main · Last updated 2026-11-05 01:34 -07:00</p>
    </figcaption>
    <p>Where the local implementer fits in an issue's life is in <a href="Issue lifecycle.html">Issue lifecycle</a>.</p>
    <div class="legend" aria-label="Colour key">
      <span><i style="background:#eef1f5;border-color:#5b6675"></i>How a start begins</span>
      <span><i style="background:#efe8fb;border-color:#6b46b0"></i>Runs on the developer's PC, unattended</span>
      <span><i style="background:#fdf0d5;border-color:#b7791f"></i>Needs the developer</span>
      <span><i style="background:#eceff2;border-color:#8a94a0"></i>Parked or left alone</span>
    </div>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    S1["A label leaves an issue<br/>ready-for-agent + local<br/>not withdrawn, no wayfinder label"]
    S2["Any issue is opened<br/>not one filed by a workflow's token"]
    S3["The developer runs /CPR"]
    S5["Daily task<br/>random time 02:01 to 02:59, plus up to 10 min<br/>also the one start that recovers a lapsed claim on a quiet repo"]
    S6["/hitl-triage relabels a local issue<br/>or the developer starts it by hand"]
    R["local-implementer-trigger.yml<br/>on the self-hosted runner<br/>PC asleep: waits in GitHub's queue, dropped after 24 hours<br/>task running: waits, then starts it"]
    TK["Scheduled task: Probanda local implementer<br/>run-local-implementer.ps1, in its own clone"]
    C1{"Clone on main,<br/>with no leftover work?"}
    C2["Save leftovers to a patch file<br/>reset to origin/main"]
    X1["Stop<br/>clone off main, or leftovers while the lock is live"]
    GD{"local_implementer_guard.py<br/>passes?"}
    GT{"Gate: choose_issue.py pick<br/>is an issue takeable?"}
    X2["Exit<br/>seconds, no tokens"]
    N["npm ci --ignore-scripts"]
    CC["claude -p /implement-queue local<br/>works one issue, then exits"]
    PR["Delete any lock stamp the run left"]
    PG{"Next takeable issue?"}
    X3["Stop rule<br/>same issue as the round started with:<br/>a failing issue cannot loop"]
    X4["No next round"]

    S1 --> R
    S2 --> R
    S3 --> R
    R --> TK
    S5 --> TK
    S6 --> TK
    TK --> C1
    C1 -->|"yes"| GD
    C1 -->|"leftovers, lock not live"| C2
    C1 -->|"no"| X1
    C2 --> GD
    GD -->|"no"| X1
    GD -->|"yes"| GT
    GT -->|"no"| X2
    GT -->|"yes"| N
    N --> CC
    CC -->|"whatever its exit code"| PR
    PR --> PG
    PG -->|"none"| X4
    PG -->|"same issue"| X3
    PG -->|"a different one: gh workflow run"| R

    classDef source fill:#eef1f5,stroke:#5b6675,color:#1d2733
    classDef pc fill:#efe8fb,stroke:#6b46b0,color:#1d2733
    classDef human fill:#fdf0d5,stroke:#b7791f,color:#1d2733
    classDef parked fill:#eceff2,stroke:#8a94a0,color:#1d2733
    class S1,S2,S5 source
    class S3,S6 human
    class R,TK,C1,C2,GD,GT,N,CC,PR,PG pc
    class X1,X2,X3,X4 parked
</pre>
    </div>
    <div class="note">
      <p>The cloud lane has no gate and no jolt, because each start would be a paid session. It starts on labels, after triage, and from its daily routine.</p>
      <p>Sources: <code>.github/workflows/local-implementer-trigger.yml</code>, <code>scripts/local-implementer/run-local-implementer.ps1</code>, <code>scripts/local-implementer/register-local-implementer.ps1</code>, <code>scripts/local_implementer_guard.py</code>, <code>scripts/choose_issue.py</code>, <code>.claude/skills/CPR/SKILL.md</code>, <code>docs/agents/issue-tracker.md</code>.</p>
    </div>
  </figure>
