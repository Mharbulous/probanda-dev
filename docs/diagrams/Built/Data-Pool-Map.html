    <p class="sources">All 76 skills in <code>source/assignment.json</code> (29 <code>lawyer</code>, 8 <code>researcher</code>, 15 <code>litigator</code>, 4 <code>file-manager</code>, 14 <code>billing</code>, 6 <code>developer</code>; <code>solicitor</code> and <code>tokeneconomizer</code> ship no skills). Each skill sits under the pool it writes, or the pool it mainly reads when read-only: <code>executive-assistant</code>, <code>wip-tracker</code>, <code>ar-follow-up</code>, <code>invoice-reviewing</code>, <code>litigation-fact-extractor</code>, <code>calendar-reminders</code>, <code>file-naming</code> and read-only researcher skills are placed this way. Skills that read several pools and write none (<code>find-document</code>, <code>file-review-prep</code>) sit in their own box. Skills that work only on documents handed to them (<code>proof-read</code>, <code>compare-documents</code>), session helpers (<code>dyu</code>, <code>TLDR</code>, <code>reflect</code>, <code>show-me</code>), maintainer dev tools (<code>CPR</code>, <code>fix-this</code>, <code>hitl-triage</code>, <code>streamline-skill</code>, <code>rule-migrate</code>), or external sources that are not Probanda data pools (<code>address-book</code> and <code>call-contact</code> over CardDAV contacts, <code>verify-bc-lawyer</code> over the Law Society of BC directory) sit under "No data pool" (<code>call-contact</code> also reads and proposes <code>tools</code> entries in practice quirks). <code>deduping-email</code> sits under Correspondence with others because <code>mail__dedupe_apply</code> moves duplicate messages to Trash in the mailbox (originals across correspondence and other mail folders). <code>suggestion</code> also writes practitioner rules to <code>preferences</code> (Institutional knowledge) via <code>preferences__write</code>. <code>safe-file-deletion</code> ships in <code>lawyer</code> with the delete-guard hook and routes deletions to <code>file-manager</code>'s <code>file_ops__trash</code> (and <code>trash-rewrite</code> hook). The planned version is in <a href="../Destinations/Data-Pool-Map.html">Destinations/Data-Pool-Map.html</a>. Sources: <code>source/assignment.json</code>, <code>plugins/*/.mcp.json</code>, <code>source/lawyer/mcp/src/schema-gen.ts</code>, <code>source/researcher/commons-mcp/src/schema-gen.ts</code> and each skill's <code>SKILL.md</code>. The placement of read-only skills is a judgment, not a check.</p>
