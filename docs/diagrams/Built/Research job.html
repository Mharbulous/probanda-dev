<pre class="mermaid">
flowchart TD
    Q(["The practitioner asks<br/>what the law is"])
    WORK["/work"]
    DRAFT["/draft"]
    ATF["/apply-to-facts"]
    VL["/verify-law"]
    JP["/job-planning"]

    LR["/legal-research<br/>the gate: runs every step"]
    DD["/drafting-data<br/>job, plan, memo"]
    WQO["westlaw-query-optimizer"]
    LG["law-getter"]
    CC["citation-checker"]
    RA["research-agent<br/>the only one that states law"]
    MR["memo-reviewer"]
    RT["research-triage"]
    MD["/matter-data"]
    ING["/ingest"]
    MEMO[("Legal memo<br/>in the issue's 6. LAW folder")]

    Q --> LR
    WORK -->|"research job"| LR
    DRAFT -->|"question of law"| LR
    ATF -->|"proposition"| LR
    VL -->|"claim fails"| LR

    LR -->|"1 write the job"| DD
    DD -->|"2 draft the query"| WQO
    WQO -->|"3 retrieve"| LG
    LG -->|"4 note up"| CC
    CC -->|"5 write the memo"| RA
    RA -->|"6 review"| MR
    MR -->|"7 save, via /drafting-data"| MEMO
    MEMO -->|"8 fetch missing decisions<br/>9 add to case data"| ING
    ING --> MD
    DRAFT -->|"10 complete the job"| DD

    JP -.->|"plan job"| DD
    LR -.->|"board mode"| RT
    LG -.->|"held copy?"| MD
    RA -.->|"needs more research"| WQO
    MR -.->|"send back"| RA

    classDef source fill:#eef1f5,stroke:#5b6675,color:#1d2733

    classDef lawyer fill:#fdf0d5,stroke:#b7791f,color:#1d2733

    class Q source
    class LR,VL,WQO,RT,LG,CC,RA,MR researcher
    class WORK,DRAFT,ATF,DD,JP litigator
