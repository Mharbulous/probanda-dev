<title>How Probanda bills a client</title>
<style>
/* Single light theme by choice: the diagram's colours carry meaning and stay fixed. */
:root {
  color-scheme: light;
  --ink: #1d2733;
  --muted: #55616f;
  --paper: #f8f9fb;
  --rule: #d5dbe3;
  --body: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
main { max-width: 1500px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; text-wrap: balance; }

code { font: 500 0.92em var(--mono); }

figcaption { display: grid; gap: 4px; }

.legend b.dashed { border-top-style: dashed; }

/* Mermaid caps each label at 200 px and wraps inside words; labels here break only at <br/>. */
pre.mermaid foreignObject div { max-width: none !important; white-space: nowrap !important; }

<main>
  <figure class="diagram" id="client-billing"
          data-based-on-commit="237d488c990d3e4aab22d78dd86e009727924ed8"
          data-updated="2026-11-11T09:00:00-07:00">
    <figcaption>
      <h1>How Probanda bills a client, from the last invoice to the signed one</h1>
      <p class="stamp">Based on commit <a href="https://github.com/Mharbulous/probanda-dev/commit/237d488c990d3e4aab22d78dd86e009727924ed8"><code>237d488c</code></a> on main · Last updated 2026-11-11 09:00 -07:00</p>
    </figcaption>
    <div class="legend" aria-label="Colour key">
      <span><i style="background:#fdf0d5;border-color:#b7791f"></i>lawyer plugin skill</span>
      <span><i style="background:#e3eefb;border-color:#2563a8"></i>billing plugin skill</span>
      <span><i style="background:#efe8fb;border-color:#6b46b0"></i>file-manager plugin skill</span>
      <span><i style="background:#eef1f5;border-color:#5b6675;border-style:double;border-width:3px"></i>Custom agent or helper</span>
      <span><i style="background:#fbe4ec;border-color:#b03060;border-radius:8px"></i>👤 You act here</span>
      <span><i style="background:#fff8c5;border-color:#8a6d00"></i>Hard check: stops the bill until it passes</span>
      <span><i style="background:#ffffff;border-color:#8a94a0"></i>Step or question</span>
      <span><i style="background:#e0f2f1;border-color:#00796b;border-radius:7px/4px"></i>Saved record or file</span>
      <span><i style="background:#e2f3e6;border-color:#2f7d46"></i>Finished result</span>
      <span><i style="background:#fff;border-color:#55616f;border-style:dashed;border-radius:8px"></i>Click to jump to another stage</span>
      <span><b></b>next step</span>
      <span><b class="dashed"></b>loops back, optional, or looks something up</span>
    </div>

    <h2 id="start">1. Find where the last bill ended</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    GO(["👤 You type /bill<br/>in the matter's folder"])
    BC["/bill<br/>runs every billing step in order<br/>and remembers how far it got"]
    MD["/matter-data<br/>looks up this matter's<br/>client number"]
    REC[("Bill record<br/>this bill's saved progress,<br/>so any session can pick it up")]
    LIVE{"Is a bill for this matter<br/>already in progress?"}
    RES["Re-check the last invoice:<br/>is it the same file?<br/>is there a newer one?"]
    NAMES["Look up the last invoice<br/>in the firm's records, then check<br/>the client folder for a newer signed one"]
    ASK(["👤 Which file is the last<br/>signed invoice? Asked only<br/>when it is still unclear"])
    LAST["Take the last signed invoice:<br/>the recorded one, or a newer one<br/>found in the folder"]
    READ["Open that invoice and read<br/>the last date it charged time for,<br/>and the hours on each date"]
    PD["/practice-data<br/>the firm's records<br/>of past invoices"]
    AGREE{{"Do the firm's records match<br/>the invoices in the folder?<br/>If not, open each one to confirm<br/>its signature and number"}}
    O1(["to 2. Find the days with work"])
    WAIT["Show you the unsigned final copy<br/>(finish making it first if it was never made).<br/>New work goes on the next bill"]
    REOPEN(["👤 Reopen this bill?<br/>Only if you ask and say why"])
    STOP1["Stop"]
    SO(["👤 Start over?<br/>Otherwise stop"])

    GO --> BC
    BC -->|"who is the client?"| MD
    BC -->|"any saved progress?"| REC
    REC --> LIVE
    LIVE -->|"yes, still being worked on"| RES
    LIVE -->|"yes, waiting for your signature"| WAIT
    WAIT --> REOPEN
    REOPEN -->|"no"| STOP1
    REOPEN -->|"yes: the final copy<br/>is marked superseded"| RES
    RES -->|"nothing changed:<br/>skip ahead"| O1
    RES -->|"something changed"| NAMES
    LIVE -->|"no: start a new bill"| NAMES
    PD -.->|"the recorded invoices"| NAMES
    NAMES --> LAST
    LAST -->|"still unclear"| ASK
    ASK --> READ
    LAST --> READ
    LAST -->|"a bill under way, but this is<br/>not the invoice it started from"| SO
    READ --> AGREE
    PD <-.->|"compares, and adds<br/>any missing invoices"| AGREE
    AGREE -->|"saves the start of this bill"| REC
    AGREE --> O1

    classDef lawyer fill:#fdf0d5,stroke:#b7791f,color:#1d2733
    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef fm fill:#efe8fb,stroke:#6b46b0,color:#1d2733
    classDef agent fill:#eef1f5,stroke:#5b6675,stroke-width:3px,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class MD,PD lawyer
    class BC tk
    class GO,ASK,REOPEN,SO human
    class AGREE gate
    class LIVE,RES,NAMES,LAST,READ,WAIT,STOP1 step
    class REC store
    class O1 link
    click O1 href "#dates"
</pre>
    </div>

    <h2 id="dates">2. Find the days with work</h2>
    <div class="chart">
<pre class="mermaid">
flowchart LR
    I2(["from 1. Find where<br/>the last bill ended"])
    TBD["/triage-billing-dates<br/>finds every day since the<br/>last invoice with signs of work"]
    SL["List everyone involved:<br/>parties, lawyers, staff, witnesses,<br/>with their emails and phone numbers"]
    HPN(["👤 You approve saving<br/>a newly found phone number"])
    DOC["Documents in the matter folder,<br/>dated by their name and contents"]
    SM["Emails you sent<br/>on this matter"]
    CALL["Phone calls with<br/>people on the list"]
    CAL["Calendar events<br/>and court filings"]
    TCE["Time already logged<br/>in TimeCamp for this matter"]
    PH["Calls seen on screen:<br/>a listed person's number<br/>in a window title"]
    KW[["Helper on the Sonnet model<br/>searches your screen activity<br/>for the matter's names"]]
    RECON{"Compare each day<br/>with the last invoice"}
    LIST[("List of days to review<br/>each rated Strong,<br/>Medium or Weak")]
    EV[("Saved evidence<br/>why each day is on the list")]
    O2(["to 3. Review each day"])

    I2 --> TBD
    TBD --> SL
    SL -.-> HPN
    TBD --> DOC
    TBD --> SM
    TBD --> CALL
    TBD --> CAL
    TBD --> TCE
    TBD --> PH
    TBD --> KW
    DOC --> RECON
    SM --> RECON
    CALL --> RECON
    CAL --> RECON
    TCE --> RECON
    PH --> RECON
    KW --> RECON
    RECON -->|"drops days already billed<br/>flags days billed too little<br/>flags days the last bill missed"| LIST
    RECON --> EV
    LIST --> O2

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef agent fill:#eef1f5,stroke:#5b6675,stroke-width:3px,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class TBD tk
    class KW agent
    class HPN human
    class SL,DOC,SM,CALL,CAL,TCE,PH,RECON step
    class LIST,EV store
    class I2,O2 link
    click I2 href "#start"
    click O2 href "#review"
</pre>
    </div>

    <h2 id="review">3. Judge the days, then review the page</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I3(["from 2. Find the days with work"])
    CW{"Running in Cowork,<br/>the web version?"}
    STOPC["Stop here: screenshots and the<br/>review page work only on your PC"]
    TC["/timecamping, parallel mode<br/>claims each listed day, strongest first,<br/>and runs up to 10 days at once.<br/>Days with only staff work are skipped"]
    JD[("Reviewed-days list<br/>a day another bill holds is<br/>skipped, then picked up")]
    OLD["A day judged in chat before the<br/>page existed has no blocks:<br/>it is judged once more to build them"]
    BT["/build-timeline<br/>gathers the day's evidence<br/>from all 7 sources, one day at a time"]
    GATE{{"Have all 7 sources<br/>reported in for this day?<br/>Nothing is judged until they have"}}
    HALT["Release this day and say<br/>which sources are missing"]
    TCD["/timecamping-data<br/>stores the evidence"]
    DB[("Saved evidence for the day")]
    SR[["screenshot-reader agent<br/>reads the picked screenshots,<br/>up to 5 at a time.<br/>Each reading is saved"]]
    DR[["day-reviewer agent<br/>on the Opus model turns one day into<br/>blocks of time. It asks nobody<br/>anything: a doubt becomes a flag"]]
    BL[("Blocks: matter, description,<br/>times, evidence, and a flag<br/>for every doubt")]
    PAGE["The review page, shown on your PC<br/>built from the saved blocks,<br/>with no model drawing it"]
    HP(["👤 You act only on flagged blocks:<br/>Approve, Correct, Write off,<br/>Split, Merge or Undo"])
    SHOW["/show-me<br/>rules for how each<br/>question is put to you"]
    TCAMP[("TimeCamp<br/>an approved change is written<br/>one entry at a time, then read back")]
    SEEN["Day clear:<br/>judged, with no flagged block"]
    WEAK(["👤 Do you want the<br/>weakest days judged too?"])
    O3(["to 4. Check every line of time"])

    I3 --> CW
    CW -->|"yes"| STOPC
    CW -->|"no"| TC
    TC <-.->|"skips days<br/>already judged"| JD
    JD -.-> OLD
    OLD -.->|"judge it again"| TC
    TC -->|"for each day"| BT
    BT --> GATE
    GATE -->|"no"| HALT
    HALT -.->|"next day"| TC
    GATE -->|"yes"| TCD
    TCD --> DB
    DB --> SR
    SR -.-> DR
    DB --> DR
    DR --> BL
    BL --> PAGE
    PAGE --> HP
    HP -.- SHOW
    HP -->|"changed matter or description"| TCAMP
    HP --> SEEN
    SEEN -->|"all days clear"| WEAK
    WEAK --> O3

    classDef lawyer fill:#fdf0d5,stroke:#b7791f,color:#1d2733
    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef agent fill:#eef1f5,stroke:#5b6675,stroke-width:3px,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class SHOW lawyer
    class TC,BT,TCD tk
    class SR,DR agent
    class HP,WEAK human
    class GATE gate
    class CW,STOPC,HALT,OLD,PAGE,SEEN step
    class JD,DB,BL,TCAMP store
    class I3,O3 link
    click I3 href "#dates"
    click O3 href "#vet"
</pre>
    </div>

    <h2 id="vet">4. Check every line of time</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I4(["from 3. Judge the days,<br/>then review the page"])
    VBT["/vet-billable-time<br/>checks every line of time<br/>before it goes on the bill"]
    TCAMP[("TimeCamp")]
    PULL["Get this matter's time entries<br/>since the last invoice"]
    T1{{"First check:<br/>every entry inside the billing period?<br/>totals match TimeCamp's own?<br/>every listed day judged?"}}
    BACK(["back to 3: judge<br/>the days that were missed"])
    PDR["/practice-data<br/>hourly rates, initials,<br/>firm billing rules"]
    HR(["👤 You supply any<br/>missing rate or rule"])
    BX["Export the reviewed blocks<br/>and turn them into the lines:<br/>each entry joins the blocks that cite it"]
    BK{{"Is every block answered?<br/>Does every entry have a block?<br/>Does every block with no entry<br/>carry an approved estimate?"}}
    PAGE2(["back to the page:<br/>answer the flagged blocks"])
    T2{{"Final check:<br/>every entry has a line backed by evidence?<br/>every listed day billed, written off or explained?<br/>total close to what the evidence shows?"}}
    OUT[("Billable time summary,<br/>audit file, and the lines for the<br/>invoice, each line naming its blocks")]
    O4(["to 5. Make the invoice"])

    I4 --> VBT
    VBT --> PULL
    TCAMP --> PULL
    PULL --> T1
    T1 -->|"a listed day<br/>was never judged"| BACK
    T1 -->|"passes"| PDR
    PDR -.-> HR
    PDR --> BX
    BX --> BK
    BK -->|"a flagged block<br/>or a gap is left"| PAGE2
    BK -->|"passes"| T2
    T2 -->|"fails: fix it with you"| PAGE2
    T2 -->|"passes"| OUT
    OUT -->|"records the time entries"| PDR
    OUT --> O4

    classDef lawyer fill:#fdf0d5,stroke:#b7791f,color:#1d2733
    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class PDR lawyer
    class VBT tk
    class HR human
    class T1,T2,BK gate
    class PULL,BX step
    class TCAMP,OUT store
    class I4,O4,BACK,PAGE2 link
    click I4 href "#review"
    click BACK href "#review"
    click PAGE2 href "#review"
    click O4 href "#render"
</pre>
    </div>

    <h2 id="render">5. Make, sign and issue the invoice</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I5(["from 4. Check every line of time"])
    CH["Draw a chart of the time<br/>if the last invoice had one"]
    HW(["👤 You choose Word or PDF"])
    TPL["/practice-data supplies the<br/>firm's invoice template and letterhead"]
    HT(["👤 You correct and approve<br/>the template, first time only"])
    TAX["Work out the tax rates<br/>from the last invoice"]
    HTX(["👤 You see the tax rates once"])
    TRU["State the trust balance<br/>if the last invoice applied trust"]
    DISB{{"Collect court fees and receipts:<br/>each fee counted once,<br/>doubtful ones flagged"}}
    HD(["👤 You decide each<br/>flagged fee and its tax"])
    REN{{"Fill in the invoice:<br/>recompute every amount,<br/>refuse anything that doesn't add up"}}
    DRAFT[("Draft invoice,<br/>marked DRAFT")]
    HY(["👤 You say it is ready to sign.<br/>From then on, new work<br/>goes on the next bill"])
    CHG(["back to the step<br/>that needs changing"])
    HN(["👤 You give the bill number<br/>from accounting"])
    FIN[("Final invoice,<br/>ready for signature")]
    SIGN(["👤 The lawyer signs it"])
    II["/issue-invoice<br/>records the signed invoice"]
    FRZ{{"Does the signed total<br/>match the checked time?"}}
    HI(["👤 You approve issuing it.<br/>This cannot be undone"])
    DONE[("Invoice issued and locked.<br/>Later fixes are recorded<br/>as adjustments")]
    LB["Lock the reviewed blocks the lines rest on:<br/>no split, merge or undo<br/>of invoiced time"]
    SCR[["scrivener agent<br/>drafts the email to accounting<br/>about moving trust money"]]
    HS(["👤 You check and<br/>send that email"])
    DC[["delivery-checker agent<br/>checks the invoice was<br/>sent and received"]]

    I5 --> CH
    CH --> HW
    HW --> TPL
    TPL -.->|"no template yet"| HT
    TPL --> TAX
    TAX --> HTX
    HTX --> TRU
    TRU --> DISB
    DISB --> HD
    HD --> REN
    REN --> DRAFT
    DRAFT --> HY
    HY -->|"needs a change"| CHG
    HY -->|"yes"| HN
    HN -->|"fill it in again,<br/>without the DRAFT mark"| FIN
    FIN --> SIGN
    SIGN --> II
    II --> FRZ
    FRZ --> HI
    HI --> DONE
    DONE --> LB
    HI -.->|"if trust money<br/>pays part of it"| SCR
    SCR --> HS
    DONE -.->|"later"| DC

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef agent fill:#eef1f5,stroke:#5b6675,stroke-width:3px,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef done fill:#e2f3e6,stroke:#2f7d46,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class II tk
    class SCR,DC agent
    class HW,HT,HTX,HD,HY,HN,SIGN,HI,HS human
    class DISB,REN,FRZ gate
    class LB step
    class CH,TPL,TAX,TRU step
    class DRAFT store
    class FIN,DONE done
    class I5,CHG link
    click I5 href "#vet"
    click CHG href "#start"
</pre>
    </div>
