    <figcaption>
      <h1>How Probanda bills a client, from the last invoice to the signed one</h1>
      <p class="stamp">Based on commit <a href="https://github.com/Mharbulous/probanda-dev/commit/c9154155c853130c6f8d587c74e106dabce0bbe0"><code>c9154155</code></a> on main · Last updated 2026-11-06 14:30 -08:00</p>
    </figcaption>
    <p>Every day with any sign of work since the last invoice must end up billed, written off with a reason, or listed as unexplained. The yellow hexagons are where a script or query refuses to go on until that holds.</p>
    <p>The process is drawn in five stages. A dashed rounded box links to another stage: click it to jump there.</p>
    <div class="legend" aria-label="Colour key">
      <span><i style="background:#fdf0d5;border-color:#b7791f"></i>lawyer plugin skill</span>

      <span><i style="background:#efe8fb;border-color:#6b46b0"></i>file-manager plugin skill</span>

      <span><i style="background:#ffffff;border-color:#8a94a0"></i>Step or decision</span>
      <span><i style="background:#e0f2f1;border-color:#00796b;border-radius:7px/4px"></i>Store or file</span>

    <div class="note">
      <p>Not drawn:</p>
      <ul>
        <li>Reopening a bill waiting for signature, and starting over. Both need the practitioner's request, and a start-over keeps the evidence, the review decisions and the TimeCamp changes.</li>
        <li>The bill record gets one row per finished step, so a fresh session on any computer resumes from it. Steps 6 to 9 always run again.</li>
        <li>Staff-only dates are not reviewed day by day. Their lines are vetted from their notes and the surrounding evidence.</li>
        <li>The judged-dates file is kept per matter, so a day reviewed in full for one matter counts as unreviewed for the next.</li>
        <li>A review decision counts only once it is written to TimeCamp, because the bill pulls only the matter's own task.</li>
        <li>When accounting confirms a trust transfer, the amount paid is imported. A correction after issue is recorded as an adjustment, never an edit.</li>
      </ul>
      <p>The full prose is <a href="../Planned/Client billing process.md">Client billing process.md</a>. Sources: <code>plugins/lawyer/skills/bill-client/</code> (with <code>render_invoice.py</code>, <code>collect_disbursements.py</code>, <code>freeze_invoice.py</code>), <code>plugins/lawyer/skills/issue-invoice/SKILL.md</code>, <code>plugins/timekeeper/skills/triage-billing-dates/SKILL.md</code>, <code>plugins/timekeeper/skills/timecamping/</code>, <code>plugins/timekeeper/skills/timecamping-data/SKILL.md</code>, <code>plugins/timekeeper/skills/vet-billable-time/</code> (with <code>tie_out.py</code>), <code>plugins/timekeeper/skills/build-timeline/SKILL.md</code>.</p>
