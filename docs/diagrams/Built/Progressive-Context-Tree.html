---
title: Skills from the Probanda marketplace only
---
flowchart LR
    START(["👤 You start a new session"])

    G1["Run the day"]
    G2["Work a matter"]
    G3["Draft and file"]
    G4["Research the law"]
    G5["Bill and track time"]
    G6["Files, mail and contacts"]
    G7["Set up and get help"]

    EA["/executive-assistant<br/>the morning briefing"]
    TP["/task-prioritization<br/>the ranked to-do list"]
    CR["/calendar-reminders<br/>what the calendar says is unfinished"]

    WK["/work<br/>a matter's Work Board and its jobs"]
    FRP["/file-review-prep<br/>brief me on a matter"]
    FD["/find-document<br/>show me a document or email"]
    ING["/ingest<br/>add a document to the case data"]
    MST["/matter-status-tracking<br/>where each file stands"]

    DR["/draft<br/>draft or revise a letter, memo or filing"]
    PR["/prepare<br/>open a BCSC application and its jobs"]
    PB["/publish<br/>turn a draft into a court form"]
    AS["/assemble<br/>bind documents into one PDF"]
    EF["/e-file<br/>file through the court portal"]
    PRF["/proof-read<br/>improve a piece of legal writing"]
    CD["/compare-documents<br/>what changed between two PDFs"]
    PRC["/precedents<br/>make or find a standard form"]

    LR["/legal-research<br/>what the law is"]
    ATF["/apply-to-facts<br/>what the law means for this matter"]
    CB["/case-brief<br/>summarize one decision"]
    VL["/verify-law<br/>check a quote, pinpoint or citation"]
    CAL["/calculate<br/>interest and bill-of-costs figures"]

    BC["/bill-client<br/>bill a matter from the last invoice"]
    II["/issue-invoice<br/>record a signed invoice"]
    TC["/timecamping<br/>correct a day's TimeCamp entries"]
    TBD["/triage-billing-dates<br/>which days to look at before billing"]
    WIP["/wip-tracker<br/>unbilled work in progress"]
    AR["/ar-follow-up<br/>chase what clients owe"]
    IR["/invoice-reviewing<br/>check a draft invoice"]
    RT["/retainer-tracking<br/>trust and retainer balances"]

    HK["/housekeeping<br/>name and file a matter's loose files"]
    RA["/route-accounting<br/>file loose bookkeeping files"]
    DE["/deduping-email<br/>remove duplicate emails"]
    CC["/call-contact<br/>call someone in your contacts"]
    VBL["/verify-bc-lawyer<br/>is this person a BC lawyer?"]

    PS["/probanda-setup<br/>set Probanda up on this device"]
    PT["/probanda-troubleshooting<br/>a tool fails or misbehaves"]
    SG["/suggestion<br/>send an idea or complaint"]
    RU["/rule-update<br/>a court rule has changed"]

    START --> G1 & G2 & G3 & G4 & G5 & G6 & G7
    G1 --> EA & TP & CR
    G2 --> WK & FRP & FD & ING & MST
    G3 --> DR & PR & PB & AS & EF & PRF & CD & PRC
    G4 --> LR & ATF & CB & VL & CAL
    G5 --> BC & II & TC & TBD & WIP & AR & IR & RT
    G6 --> HK & RA & DE & CC & VBL
    G7 --> PS & PT & SG & RU

    classDef lawyer fill:#fdf0d5,stroke:#b7791f,color:#1d2733
    classDef researcher fill:#ddf3ef,stroke:#1f7a6d,color:#1d2733

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef fm fill:#efe8fb,stroke:#6b46b0,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733

    <p class="sources">Left out on purpose: skills only other skills call (<code>matter-data</code>, <code>practice-data</code>, <code>drafting-data</code> and the other gatekeepers), steps another skill runs for you (<code>solver</code>, <code>narrator</code>, <code>bcsc-legal-basis</code>, <code>vet-billable-time</code>, <code>build-timeline</code>, <code>time-sorting</code>, <code>job-planning</code>, <code>ingest-orchestrator</code>), add-ons typed inside a session (<code>dyu</code>, <code>TLDR</code>, <code>reflect</code>, <code>show-me</code>), and every <code>developer</code> skill. Sources: <code>source/assignment.json</code> and each skill's <code>SKILL.md</code> description.</p>
