    <p class="sources">The plugins and their entry skills are the same as today's tree (<a href="../Built/Progressive-Context-Tree.html">Built/Progressive-Context-Tree.html</a>): Phase 2 moves no skill. Left out on purpose, as there: skills only other skills call (the gatekeepers), steps another skill runs for you, add-ons typed inside a session, and every <code>developer</code> skill. A pool listed on a skill is one it reads or writes, through its own tools, a gatekeeper skill it names, or an agent it dispatches (<code>docket-clerk</code> writes events, <code>research-agent</code> reads the law). Pools were found by scanning each skill's files for the data tools and gatekeepers they name, and from its description where it works through a gatekeeper; that second part is a judgment. "Billing records (lawyer's store)" are time entries, invoices, payments and rates in <code>practice.db</code>, which the billing skills write through lawyer's tools; "Billing work in progress" is a bill in progress and draft time entries, in billing's own store. The calendar, the address book and the Law Society directory are sources, not pools. Each pool is defined in <code>docs/Plans/2026-11-10_data-pool-framework.md</code>, and every store decision in <code>docs/Plans/2026-11-10_data-store-restructure-phase-2.md</code>.</p>
