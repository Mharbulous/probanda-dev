<main>
  <figure class="diagram" id="client-billing-destination"
          data-based-on-commit="f308fe7aa0021be0cce367c9b940923bb842d2a9"
          data-updated="2026-11-10T23:29:00-07:00">
    <figcaption>
      <h1>How Probanda will bill a client, once the time review redesign is built</h1>
      <p class="stamp">Planned, from the spec at commit <a href="https://github.com/Mharbulous/probanda-dev/commit/f308fe7aa0021be0cce367c9b940923bb842d2a9"><code>f308fe7a</code></a> on main · Last updated 2026-11-10 23:29 -07:00</p>
    </figcaption>

    <div class="panels">
      <div class="panel">
        <h3>Goals</h3>
        <ul>
          <li><b>Defensible:</b> every billed minute opens to the evidence behind it (stage 5)</li>
          <li><b>Transparent:</b> an approval means you looked; auto-assigned blocks say so (stage 5)</li>
          <li><b>Your attention on the hard cases:</b> you act only on flagged blocks (stages 4, 5)</li>
          <li><b>Fast:</b> up to 10 days judged at once, no questions mid-review (stage 4)</li>
          <li><b>Work accumulates:</b> the list grows, readings and judged days are reused (stages 2, 3, 4)</li>
          <li><b>Safe in parallel:</b> claims, one writer, refused stale saves, reversible merges (stages 1, 4, 5)</li>
        </ul>
      </div>
      <div class="panel">
        <h3>Constraints</h3>
        <ul>
          <li><b>Token cost:</b> code where possible, Haiku for screenshots, Opus only to judge</li>
          <li>A model reads each raw item at most once; results are saved</li>
          <li>The page is a template filled from the database, never drawn by a model</li>
          <li>The whole day is reviewed, never one matter</li>
          <li>Agents propose; you decide; the lawyer's signature is final</li>
          <li>No one-way doors before issue; client data stays on your PC</li>
        </ul>
      </div>
      <div class="panel">
        <h3>What changes from today</h3>
        <ul>
          <li>One review page replaces the day review and line vetting in chat</li>
          <li>The candidate list grows across runs instead of being rebuilt</li>
          <li>Evidence is gathered first, then days are judged in parallel by day-reviewer agents</li>
          <li>Each date has one shared status, so two bills never judge it twice</li>
          <li>Screenshot readings are saved and reused</li>
        </ul>
      </div>
    </div>

    <div class="legend" aria-label="Colour key">
      <span><i style="background:#fdf0d5;border-color:#b7791f"></i>lawyer plugin skill</span>

    <h2 id="start">1. Find where the last bill ended</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    GO(["👤 You type /bill<br/>in the matter's folder"])
    BC["/bill<br/>the orchestrator: the only writer<br/>of this bill's record"]
    REC[("Bill record<br/>this bill's saved progress")]
    SAVE{{"Save refused if the record<br/>changed since it was read"}}
    LIVE{"Is a bill for this matter<br/>already in progress?"}
    SAME{"Is the last invoice<br/>still the same file?"}
    NEW["Find and read the newest signed invoice:<br/>file names checked, /housekeeping if needed,<br/>firm records compared"]
    PD["/practice-data<br/>past invoices"]
    O2(["to 2. Candidate dates"])

    GO --> BC
    BC <-.-> REC
    REC -.- SAVE
    BC --> LIVE
    LIVE -->|"yes"| SAME
    LIVE -->|"no"| NEW
    SAME -->|"yes: keep it"| O2
    SAME -->|"no"| NEW
    PD <-.-> NEW
    NEW --> O2

    classDef lawyer fill:#fdf0d5,stroke:#b7791f,color:#1d2733
    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class PD lawyer
    class BC tk
    class GO human
    class SAVE gate
    class LIVE,SAME,NEW step
    class REC store
    class O2 link
    click O2 href "#dates"
</pre>
    </div>

    <h2 id="dates">2. Candidate dates: grow the saved list</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I2(["from 1"])
    TBD["/triage-billing-dates"]
    HAVE{"Is there a saved list<br/>for this bill?"}
    FULL["Search every source<br/>since the last invoice"]
    INC["Search only the days after the<br/>last covered date, plus the leads<br/>left open last time"]
    CHK{{"Does every listed date<br/>still have its evidence?"}}
    REDO["Search that date again<br/>and tell you"]
    FP{{"Has TimeCamp changed on a judged day<br/>since its fingerprint was saved?"}}
    REFLAG["Flag only the entries<br/>that changed; the day is<br/>no longer clear"]
    LIST[("Candidate dates in the database<br/>each with strength, when found,<br/>and links to its evidence")]
    MD["Candidate dates file in BILLING,<br/>written from the database for you to read"]
    O3(["to 3. Gather the evidence"])

    I2 --> TBD
    TBD --> HAVE
    HAVE -->|"no"| FULL
    HAVE -->|"yes"| CHK
    CHK -->|"a date is missing rows"| REDO
    CHK --> FP
    FP -->|"yes"| REFLAG
    FP --> INC
    REDO --> INC
    FULL --> LIST
    INC -->|"keeps every saved date,<br/>adds new ones"| LIST
    LIST --> MD
    LIST --> O3

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef script fill:#f1f8e9,stroke:#558b2f,stroke-dasharray:5 3,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class TBD tk
    class CHK,FP gate
    class HAVE,FULL,INC,REDO,REFLAG step
    class LIST store
    class MD script
    class I2,O3 link
    click I2 href "#start"
    click O3 href "#gather"
</pre>
    </div>

    <h2 id="gather">3. Gather the evidence, in one place</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I3(["from 2"])
    CW{"Running in Cowork?"}
    STOPC["Stop: screenshots can be<br/>read only on your PC"]
    LOOP["For each candidate date in turn,<br/>strongest first, not yet judged"]
    FETCH["Fetch the day's 7 sources<br/>/build-timeline and /timecamping,<br/>one date at a time, never in parallel"]
    GATE{{"Have all 7 sources<br/>reported for this day?"}}
    SKIP["Skip the day and say<br/>which sources are missing"]
    PICK["Pick screenshots to read:<br/>first, middle, last of each stretch,<br/>and every window-title change"]
    SYNC["Later: SyncoPaid picks them<br/>at capture time"]
    HR[["screenshot-reader agents · Haiku 5.5<br/>in parallel, describe each capture"]]
    SUM["Reduce mail, calls, document metadata<br/>and window activity to evidence rows"]
    SUMM[["Sonnet or Haiku, only where<br/>a script cannot do it"]]
    DB[("Time-review database<br/>evidence rows, each labelled by source,<br/>and a saved reading for each capture")]
    O4(["to 4. Judge the days"])

    I3 --> CW
    CW -->|"yes"| STOPC
    CW -->|"no"| LOOP
    LOOP --> FETCH
    FETCH --> GATE
    GATE -->|"no"| SKIP
    SKIP -.->|"next date"| LOOP
    GATE -->|"yes"| PICK
    SYNC -.->|"replaces"| PICK
    PICK --> HR
    GATE -->|"yes"| SUM
    SUM -.-> SUMM
    HR --> DB
    SUM --> DB
    DB -.->|"next date"| LOOP
    DB --> O4

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef agent fill:#eef1f5,stroke:#5b6675,stroke-width:3px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef script fill:#f1f8e9,stroke:#558b2f,stroke-dasharray:5 3,color:#1d2733
    classDef future fill:#ffffff,stroke:#8a94a0,stroke-dasharray:2 2,color:#55616f
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class FETCH tk
    class HR,SUMM agent
    class GATE gate
    class CW,STOPC,LOOP,SKIP step
    class PICK,SUM script
    class SYNC future
    class DB store
    class I3,O4 link
    click I3 href "#dates"
    click O4 href "#judge"
</pre>
    </div>

    <h2 id="judge">4. Judge the days, up to 10 at once</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I4(["from 3"])
    ORCH["/bill orchestrator<br/>hands out dates, candidate dates first,<br/>at most 10 day reviewers at once"]
    STAT[("Date status, shared by every matter<br/>not started · in progress · judged · clear")]
    CLAIM{{"Claim the date:<br/>refused if another run holds it.<br/>A claim expires if its run dies"}}
    OTHER["Already judged for another matter:<br/>reuse it, never judge it again"]
    BUSY["Claimed by another bill:<br/>move on, use it when finished"]
    DR[["day-reviewer agent · Opus 5.5, high effort<br/>one per date, reads the assembled day:<br/>blocks, evidence rows, screenshot readings"]]
    JUDGE["Give each block a matter and a<br/>description in firm billing style"]
    DOUBT{"Is a block unclear?"}
    ASK[["Ask the screenshot reader<br/>a specific question · Haiku 5.5"]]
    STILL{"Do the answers seem<br/>doubtful or unreliable?"}
    LOOK["Open that capture itself,<br/>sparingly"]
    FLAG["Flag the block<br/>for your review"]
    HOLD[("Holding area: the day's blocks,<br/>flags and evidence links.<br/>No TimeCamp write tool")]
    RET["Return one line, e.g.<br/>2026-10-02: 14 blocks, 3 flagged"]
    RCHK(["👤 Ask for a full re-check<br/>of a date or a bill"])
    CMP["A fresh day reviewer judges again<br/>and flags differences;<br/>nothing stored is overwritten"]
    O5(["to 5. Review on the page"])

    I4 --> ORCH
    ORCH --> CLAIM
    STAT <-.-> CLAIM
    CLAIM -->|"judged already"| OTHER
    CLAIM -->|"held by another bill"| BUSY
    CLAIM -->|"claimed"| DR
    DR --> JUDGE
    JUDGE --> DOUBT
    DOUBT -->|"yes"| ASK
    ASK --> STILL
    STILL -->|"yes"| LOOK
    STILL -->|"no: resolved"| HOLD
    LOOK -->|"still unclear"| FLAG
    LOOK -->|"resolved"| HOLD
    DOUBT -->|"no"| HOLD
    FLAG --> HOLD
    HOLD --> RET
    RET -->|"date marked judged"| STAT
    RET -.->|"next date"| ORCH
    RCHK -.-> CMP
    CMP -.-> HOLD
    ORCH -->|"all dates judged"| O5

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef agent fill:#eef1f5,stroke:#5b6675,stroke-width:3px,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class ORCH tk
    class DR,ASK agent
    class RCHK human
    class CLAIM gate
    class OTHER,BUSY,JUDGE,DOUBT,STILL,LOOK,FLAG,RET,CMP step
    class STAT,HOLD store
    class I4,O5 link
    click I4 href "#gather"
    click O5 href "#review"
</pre>
    </div>

    <h2 id="review">5. Review on the page</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I5(["from 4"])
    TPL["Fill the review template<br/>from the database"]
    PAGE["Review page, opened from a file card<br/>on your PC. Filters: date, matter.<br/>Buttons: Previous, Next, Next flagged"]
    CARD["Each block's card: client and matter,<br/>description, times, a slideshow of every<br/>screenshot with its reading, and its evidence"]
    WAIT["A session waits on the page<br/>while you review"]
    ACT(["👤 On any block:<br/>Approve · Correct · Write off<br/>Split · Merge · Unmerge"])
    TC{{"Write the change to TimeCamp at once,<br/>then read it back to confirm"}}
    TCAMP[("TimeCamp")]
    SPL["Split: redraft both halves<br/>from the saved readings,<br/>no new look at any image"]
    MRG["Merge: join descriptions with a semicolon.<br/>Originals kept, so unmerge works<br/>until the invoice is issued"]
    REC[("Approvals, corrections,<br/>write-offs, merges and splits")]
    CLEAR{"Every flagged block on this day,<br/>across all matters, dealt with?"}
    DAY["The day is clear"]
    O6(["to 6. Make the invoice"])

    I5 --> TPL
    TPL --> PAGE
    PAGE --> CARD
    PAGE -.- WAIT
    CARD --> ACT
    ACT -->|"matter or description changed"| TC
    TC --> TCAMP
    ACT -->|"split"| SPL
    ACT -->|"merge or unmerge"| MRG
    SPL -->|"halves come back flagged"| REC
    MRG --> REC
    ACT --> REC
    REC -.->|"page refreshes"| TPL
    REC --> CLEAR
    CLEAR -->|"yes"| DAY
    CLEAR -->|"no: Next flagged"| CARD
    DAY -->|"only flagged blocks need you;<br/>the rest go on as auto-assigned"| O6

    classDef script fill:#f1f8e9,stroke:#558b2f,stroke-dasharray:5 3,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef step fill:#ffffff,stroke:#8a94a0,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class TPL,MRG script
    class ACT human
    class TC gate
    class PAGE,CARD,WAIT,SPL,CLEAR,DAY step
    class TCAMP,REC store
    class I5,O6 link
    click I5 href "#judge"
    click O6 href "#invoice"
</pre>
    </div>

    <h2 id="invoice">6. Make, sign and issue the invoice</h2>
    <div class="chart">
<pre class="mermaid">
flowchart TD
    I6(["from 5"])
    TIE{{"Tie out the time:<br/>every line backed by evidence,<br/>totals match TimeCamp"}}
    REN{{"Fill in the invoice:<br/>recompute every amount,<br/>refuse anything that doesn't add up"}}
    DRAFT[("Draft invoice, marked DRAFT,<br/>listing every line")]
    HY(["👤 You say it is ready to sign,<br/>and give the bill number"])
    SIGN(["👤 The lawyer signs it:<br/>the final approval of every line"])
    II["/issue-invoice<br/>records it and locks its support"]
    DONE[("Invoice issued and locked.<br/>Merges and splits become final")]

    I6 --> TIE
    TIE --> REN
    REN --> DRAFT
    DRAFT --> HY
    HY --> SIGN
    SIGN --> II
    II --> DONE

    classDef tk fill:#e3eefb,stroke:#2563a8,color:#1d2733
    classDef human fill:#fbe4ec,stroke:#b03060,stroke-width:2px,color:#1d2733
    classDef gate fill:#fff8c5,stroke:#8a6d00,stroke-width:2px,color:#1d2733
    classDef store fill:#e0f2f1,stroke:#00796b,color:#1d2733
    classDef done fill:#e2f3e6,stroke:#2f7d46,color:#1d2733
    classDef link fill:#ffffff,stroke:#55616f,stroke-dasharray:4 3,color:#1d2733
    class II tk
    class HY,SIGN human
    class TIE,REN gate
    class DRAFT store
    class DONE done
    class I6 link
    click I6 href "#review"
</pre>
