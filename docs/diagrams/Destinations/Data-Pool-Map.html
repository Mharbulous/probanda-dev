    <p class="sources">A data pool is a database (most are SQLite), folders of files, or both: evidence, for example, is the matter's records of who produced what and the produced documents themselves. Each skill sits under the pool it writes. A skill that writes nothing sits under the pool it mainly reads: <code>executive-assistant</code>, <code>wip-tracker</code>, <code>ar-follow-up</code>, <code>calendar-reminders</code> and most of researcher are placed this way. A skill that reads several pools and writes none (<code>find-document</code>, <code>file-review-prep</code>) is not forced into one, and a skill that works only on the documents it is handed (<code>proof-read</code>, <code>compare-documents</code>) has no data pool. Box colours show each skill's plugin today, after Phase 1 replaced timekeeper with billing. Know-how is what holds for any firm in the same venue and could one day be shared; institutional knowledge is what holds for this firm only and stays on its machine. <code>localize</code> writes both, learned venue requirements and the firm's declared document types, and sits under know-how, which it mainly writes. <code>rule-update</code> records a court-rule change, which is the law. <code>file-naming</code> writes nothing and its convention ships in the plugin, so it sits under know-how. <code>rule-migrate</code> writes nothing (it emits a prompt for repository edits), so it has no data pool. The court calendar and the rule overlay are kept in the <code>practice-data</code> store. Where the stores differ from the pools: the <code>matter-data</code> store is three files per matter (<code>main.sqlite</code> for evidence and the court record, <code>law.sqlite</code> for the matter's stored authorities, <code>privileged.sqlite</code> for client instructions), all written by the one <code>matter-data</code> skill; the <code>practice-data</code> store holds practice records, billing, trust accounting and events (anchors and deadlines). Deadlines are written by the <code>docket-clerk</code> agent, which is not a skill, so the events pool shows only <code>calendar-reminders</code>. Correspondence with others has two originals, the matter's mail folder and its Correspondence folder of scanned letters, which skills read as sources and no skill writes; a derived, searchable correspondence store is planned (Phase 2, decision 7). The file-manager skills under "Every pool's folders" name, file, move and trash files in whichever pool's folders they belong to, so they cut across pools by design. Probanda's own records are its suggestion box and troubleshooting store. Sources: <code>source/assignment.json</code>, each skill's <code>SKILL.md</code> and the data-server tools its files name. The placement of read-only skills is a judgment, not a check.</p>
