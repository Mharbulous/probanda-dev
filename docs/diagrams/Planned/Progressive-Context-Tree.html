    <p class="sources">timekeeper is retired: it ships no skills once everything has moved to time-billing, and is later removed from the marketplace. developer is maintainer-only and has no lawyer entry skills. What moves to time-billing: every skill timekeeper ships today, its TimeCamp server (key <code>timecamp</code>) and its hooks, plus <code>bill-client</code>, <code>issue-invoice</code>, <code>invoice-reviewing</code> and <code>wip-tracker</code> from lawyer, which today reach into timekeeper through written exceptions in <code>source/layering.json</code>. Timekeeper's skills that only other skills run (<code>build-timeline</code>, <code>time-sorting</code>, <code>time-entry-drafting</code>, <code>vet-billable-time</code>, <code>timecamping-data</code>, <code>time-pipeline-data</code>) move too but are not entry points, so they are not drawn. What stays: <code>invoice-tracking</code>, <code>retainer-tracking</code> and <code>ar-follow-up</code> stay in lawyer, because they work from imported invoices and trust balances rather than tracked time, and <code>probanda-setup</code>, <code>practice-data</code> and <code>task-prioritization</code> rely on them. litigator's <code>calculate</code> stays: its bill of costs is a court costs claim, not the firm's billing. The survey found no other billing skill in researcher, litigator or file-manager. Left out of every plugin as before: skills only other skills call, add-ons typed inside a session, and every <code>developer</code> skill. Sources: <code>source/assignment.json</code>, <code>.claude-plugin/marketplace.json</code>, <code>source/layering.json</code> and each skill's <code>SKILL.md</code>.</p>
