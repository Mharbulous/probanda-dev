    <p class="sources">Each dashed box is a data pool: a database, folders of files, or both. A skill sits in the pool it writes, or, if it writes nothing, the pool it mainly reads. This is a target layout, not today's. So far the plan settles only billing: billing and timekeeping records each sit whole under the billing plugin. Six pools are still boxed under two plugins, because no move has been decided for them: evidence, the court record, work product and drafts (lawyer and litigator), every pool's folders (lawyer and file-manager) and Probanda's own records (lawyer and researcher). The placement of every skill, including those not drawn here, and the scope each pool belongs to are in <a href="Data-Pool-Map.html">Data-Pool-Map.html</a>. The new plugin's name is <code>billing</code>, displayed as "Billing". timekeeper is retired: it ships no skills once everything has moved to billing, and is later removed from the marketplace. developer is maintainer-only and has no lawyer entry skills. What moves to billing: every skill timekeeper ships today, its TimeCamp server (key <code>timecamp</code>) and its hooks; <code>bill-client</code>, <code>issue-invoice</code>, <code>invoice-reviewing</code> and <code>wip-tracker</code> from lawyer, which today reach into timekeeper through written exceptions in <code>source/layering.json</code>; and <code>ar-follow-up</code> and <code>invoice-tracking</code> from lawyer, which nothing in lawyer needs in order to run. Timekeeper's skills that only other skills run (<code>build-timeline</code>, <code>time-sorting</code>, <code>vet-billable-time</code>, <code>timecamping-data</code>, <code>time-pipeline-data</code>) move too but are not entry points, so they are not drawn. What the move costs, counted per file as <code>check_layering.py</code> counts: it clears 7 of the 9 rulings the four lawyer billing skills hold today (<code>bill-client</code> to <code>housekeeping</code> and <code>issue-invoice</code> to <code>legal-research</code> stay), and lawyer files that still name a moved skill need new mention rulings, about 13 in all: 5 for <code>invoice-tracking</code> (three practice-data files, probanda-setup, retainer-tracking's vision), 3 for <code>ar-follow-up</code> (three vision files), 4 for <code>issue-invoice</code> (draft's <code>letters.md</code> in litigator, practice-data, the delivery-checker agent, and <code>shared/procedural-history.md</code>, which the check does not scan) and 1 for <code>wip-tracker</code>. The move also renames the TimeCamp tools from <code>mcp__plugin_timekeeper_timecamp__*</code> to <code>mcp__plugin_billing_timecamp__*</code>: the skills and tests that name them, and the two hooks that hard-code the <code>timekeeper:</code> prefix (<code>ceremony-gate.py</code>, <code>screenshot-reader-gate.py</code>), change in the same commit. The saved TimeCamp login is kept outside the plugin's data folder, so it survives. Retiring timekeeper is a one-way door; the reversible alternative, a <code>billing</code> plugin that requires timekeeper, was weighed and not chosen, because there are no users yet and <code>bill-client</code> already cannot run without timekeeper. What stays: <code>retainer-tracking</code> stays in lawyer, because <code>executive-assistant</code> and <code>task-prioritization</code> rank every to-do by its trust balances. litigator's <code>calculate</code> stays: its bill of costs is a court costs claim, not the firm's billing. The survey found no other billing skill in researcher, litigator or file-manager. Left out of every plugin as before: skills only other skills call, add-ons typed inside a session, and every <code>developer</code> skill. Sources: <code>source/assignment.json</code>, <code>.claude-plugin/marketplace.json</code>, <code>source/layering.json</code> and each skill's <code>SKILL.md</code>.</p>
