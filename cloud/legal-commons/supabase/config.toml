# The project's Edge Functions: the pool's five (commons-*), the practice
# items' three (items-*) and the Suggestion Box's six (suggestion-*). JWT verification is off for each because neither the
# project's secret keys nor install keys are JWTs: each function checks the
# caller's `apikey` header itself (functions/_shared/caller.ts) before it reads
# the request body.

project_id = "nbzkuhgiqscjkypedqff"

[functions.commons-search]
verify_jwt = false

[functions.commons-contribute]
verify_jwt = false

[functions.commons-reembed]
verify_jwt = false

[functions.commons-find]
verify_jwt = false

[functions.commons-read]
verify_jwt = false

[functions.items-write]
verify_jwt = false

[functions.items-sync]
verify_jwt = false

[functions.items-seed]
verify_jwt = false

[functions.suggestion-submit]
verify_jwt = false

[functions.suggestion-list]
verify_jwt = false

[functions.suggestion-set-status]
verify_jwt = false

[functions.suggestion-status]
verify_jwt = false

[functions.suggestion-attach-specification]
verify_jwt = false

[functions.suggestion-withdraw]
verify_jwt = false

# The key-request queue's four (key-request-*). submit and status take no key
# at all (serveOpen in functions/_shared/caller.ts), because the practitioner
# asking for a key has none; list and set-status take the project secret only.

[functions.key-request-submit]
verify_jwt = false

[functions.key-request-status]
verify_jwt = false

[functions.key-request-list]
verify_jwt = false

[functions.key-request-set-status]
verify_jwt = false
