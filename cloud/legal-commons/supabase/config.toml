# The project's Edge Functions: the pool's five (commons-*), the practice
# items' three (items-*) and the Suggestion Box's three (suggestion-*). JWT verification is off for each because neither the
# project's secret keys nor install keys are JWTs: each function checks the
# caller's `apikey` header itself (functions/_shared/caller.ts) before it reads
# the request body.

