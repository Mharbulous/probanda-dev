# The project's Edge Functions: the pool's four (commons-*) and the practice
# items' three (items-*). JWT verification is off for each because the project's
# secret keys are not JWTs: each function checks the caller's `apikey` header
# itself (functions/_shared/caller.ts) before it reads the request body.

project_id = "nbzkuhgiqscjkypedqff"

[functions.commons-search]
verify_jwt = false

[functions.commons-contribute]
